<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Azzio Pictures folder (theme name folder-pictures, the Pictures dir). Base Azzio folder
