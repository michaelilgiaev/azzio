<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Azzio generic folder. The BASE of the whole Azzio folder set: every typed folder
       (folder-documents, folder-music, and the rest) is this shape with a white symbol cut
       into the front flap. Bare (transparent background, folder fills the canvas) like
       Adwaita's own folders; the dark rounded badge is only for the app-launcher tile
       (assets/icons/file_manager.svg), NOT for folders in the file list. Cyan to blue Azzio
       gradient (#07AFE8, #06B8FD, #0064F9), matching file_manager.svg and search.svg. Shipped
       into the Azzio icon theme as `folder` so it wins over Adwaita's. -->
  <defs>
    <linearGradient id="azFolder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07AFE8"/>
      <stop offset="0.5" stop-color="#06B8FD"/>
      <stop offset="1" stop-color="#0064F9"/>
    </linearGradient>
    <linearGradient id="azFolderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0698D6"/>
      <stop offset="1" stop-color="#0052CC"/>
    </linearGradient>
  </defs>
  <!-- Folder back panel + tab (slightly darker, sits behind the front flap). -->
  <path fill="url(#azFolderBack)"
        d="M14 40
           a10 10 0 0 1 10 -10
           h26
           a10 10 0 0 1 8 4
           l7 9
           h35
           a10 10 0 0 1 10 10
           v51
           a10 10 0 0 1 -10 10
           H24
           a10 10 0 0 1 -10 -10
           Z"/>
  <!-- Folder front flap (the brighter gradient, offset down so the tab shows). -->
  <path fill="url(#azFolder)"
        d="M14 56
           a10 10 0 0 1 10 -10
           h80
           a10 10 0 0 1 10 10
           v42
           a10 10 0 0 1 -10 10
           H24
           a10 10 0 0 1 -10 -10
           Z"/>
</svg>
