<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Azzio "Copy" context-menu icon (theme name edit-copy). Two overlapping sheets in the
       Azzio cyan-to-blue gradient. Overrides Adwaita's edit-copy for the right-click Copy. -->
  <defs>
    <linearGradient id="azGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07AFE8"/>
      <stop offset="0.5" stop-color="#06B8FD"/>
      <stop offset="1" stop-color="#0064F9"/>
    </linearGradient>
    <linearGradient id="azGradBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0698D6"/>
      <stop offset="1" stop-color="#0052CC"/>
    </linearGradient>
  </defs>
  <!-- Back sheet (behind, darker). -->
  <rect x="30" y="24" width="52" height="66" rx="8" fill="url(#azGradBack)"/>
  <!-- Front sheet (offset down-right, brighter). -->
  <rect x="48" y="42" width="52" height="66" rx="8" fill="url(#azGrad)"/>
</svg>
