<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Azzio Config folder (Azzio-only name folder-config, the ~/Config shortcut, which links
       to .config). No XDG theme name, so the vendored file manager maps this basename to it. Base
       Azzio folder plus a white gear/cog on the front flap (settings). -->
  <defs>
    <linearGradient id="azFolder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07AFE8"/>
      <stop offset="0.5" stop-color="#06B8FD"/>
      <stop offset="1" stop-color="#0064F9"/>
    </linearGradient>
    <linearGradient id="azFolderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0698D6"/>
      <stop offset="1" stop-color="#0052CC"/>
    </linearGradient>
  </defs>
  <path fill="url(#azFolderBack)" d="M14 40 a10 10 0 0 1 10 -10 h26 a10 10 0 0 1 8 4 l7 9 h35 a10 10 0 0 1 10 10 v51 a10 10 0 0 1 -10 10 H24 a10 10 0 0 1 -10 -10 Z"/>
  <path fill="url(#azFolder)" d="M14 56 a10 10 0 0 1 10 -10 h80 a10 10 0 0 1 10 10 v42 a10 10 0 0 1 -10 10 H24 a10 10 0 0 1 -10 -10 Z"/>
  <!-- White gear: eight teeth (a rotated square overlaid on an upright one) plus a ring, with the
       hub cut back to the gradient so it reads as a cog. -->
  <g fill="#ffffff">
    <rect x="58" y="60" width="12" height="40" rx="3"/>
    <rect x="44" y="74" width="40" height="12" rx="3"/>
    <rect x="58" y="60" width="12" height="40" rx="3" transform="rotate(45 64 80)"/>
    <rect x="44" y="74" width="40" height="12" rx="3" transform="rotate(45 64 80)"/>
    <circle cx="64" cy="80" r="16"/>
  </g>
  <circle fill="#06B8FD" cx="64" cy="80" r="7"/>
</svg>
