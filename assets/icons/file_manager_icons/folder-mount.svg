<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Azzio mount-point folder (Azzio-only name folder-mount). The SPECIAL mount-point
       symbol for Shared AND Mounts: the user removed the mount-point emblem/overlay, so mount
       points get their OWN base icon instead. Base Azzio folder + a white disk/drive platter
       with a connector, on the front flap. -->
  <defs>
    <linearGradient id="azFolder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07AFE8"/>
      <stop offset="0.5" stop-color="#06B8FD"/>
      <stop offset="1" stop-color="#0064F9"/>
    </linearGradient>
    <linearGradient id="azFolderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0698D6"/>
      <stop offset="1" stop-color="#0052CC"/>
    </linearGradient>
  </defs>
  <path fill="url(#azFolderBack)" d="M14 40 a10 10 0 0 1 10 -10 h26 a10 10 0 0 1 8 4 l7 9 h35 a10 10 0 0 1 10 10 v51 a10 10 0 0 1 -10 10 H24 a10 10 0 0 1 -10 -10 Z"/>
  <path fill="url(#azFolder)" d="M14 56 a10 10 0 0 1 10 -10 h80 a10 10 0 0 1 10 10 v42 a10 10 0 0 1 -10 10 H24 a10 10 0 0 1 -10 -10 Z"/>
  <!-- White disk/drive: an ellipse platter with a hub, sitting on a short stack. -->
  <ellipse fill="#ffffff" cx="64" cy="74" rx="20" ry="8"/>
  <path fill="#ffffff" d="M44 74 v14 a20 8 0 0 0 40 0 V74 a20 8 0 0 1 -40 0 Z"/>
  <ellipse fill="#06B8FD" cx="64" cy="74" rx="6" ry="2.6"/>
</svg>
