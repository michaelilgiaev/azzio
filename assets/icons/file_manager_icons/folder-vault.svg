<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Azzio Vault folder (Azzio-only name folder-vault, the Vault dir). No XDG theme
       name, so the vendored file manager maps this basename to it. Base Azzio folder plus a
       white padlock on the front flap. -->
  <defs>
    <linearGradient id="azFolder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07AFE8"/>
      <stop offset="0.5" stop-color="#06B8FD"/>
      <stop offset="1" stop-color="#0064F9"/>
    </linearGradient>
    <linearGradient id="azFolderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0698D6"/>
      <stop offset="1" stop-color="#0052CC"/>
    </linearGradient>
  </defs>
  <path fill="url(#azFolderBack)" d="M14 40 a10 10 0 0 1 10 -10 h26 a10 10 0 0 1 8 4 l7 9 h35 a10 10 0 0 1 10 10 v51 a10 10 0 0 1 -10 10 H24 a10 10 0 0 1 -10 -10 Z"/>
  <path fill="url(#azFolder)" d="M14 56 a10 10 0 0 1 10 -10 h80 a10 10 0 0 1 10 10 v42 a10 10 0 0 1 -10 10 H24 a10 10 0 0 1 -10 -10 Z"/>
  <!-- White padlock: shackle + body with a keyhole cut to the gradient. -->
  <path fill="none" stroke="#ffffff" stroke-width="6" d="M55 76 v-6 a9 9 0 0 1 18 0 v6"/>
  <rect fill="#ffffff" x="49" y="76" width="30" height="24" rx="4"/>
  <circle fill="#06B8FD" cx="64" cy="86" r="4"/>
  <rect fill="#06B8FD" x="62" y="86" width="4" height="8" rx="2"/>
</svg>
