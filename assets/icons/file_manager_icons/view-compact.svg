<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Azzio "Compact List View" icon (theme name view-compact). Tight rows of short bars, in the
       Azzio cyan-to-blue gradient. Overrides Adwaita's view-compact for the toolbar view switcher
       and the "compact list view" menu entry. -->
  <defs>
    <linearGradient id="azGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07AFE8"/>
      <stop offset="0.5" stop-color="#06B8FD"/>
      <stop offset="1" stop-color="#0064F9"/>
    </linearGradient>
  </defs>
  <rect x="24" y="28" width="46" height="11" rx="5" fill="url(#azGrad)"/>
  <rect x="24" y="46" width="46" height="11" rx="5" fill="url(#azGrad)"/>
  <rect x="24" y="64" width="46" height="11" rx="5" fill="url(#azGrad)"/>
  <rect x="24" y="82" width="46" height="11" rx="5" fill="url(#azGrad)"/>
  <rect x="80" y="28" width="24" height="11" rx="5" fill="url(#azGrad)"/>
  <rect x="80" y="46" width="24" height="11" rx="5" fill="url(#azGrad)"/>
  <rect x="80" y="64" width="24" height="11" rx="5" fill="url(#azGrad)"/>
  <rect x="80" y="82" width="24" height="11" rx="5" fill="url(#azGrad)"/>
</svg>
