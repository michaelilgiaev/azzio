<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Azzio Trash folder (Azzio-only name folder-trash, the ~/Trash shortcut, which links to
       .local/share/Trash/files). No XDG theme name, so the vendored file manager maps this
       basename to it. Base Azzio folder plus a white trash can on the front flap. This is the
       shortcut's OWN folder-style icon; the built-in trash:/// place keeps the system
       user-trash icon. -->
  <defs>
    <linearGradient id="azFolder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07AFE8"/>
      <stop offset="0.5" stop-color="#06B8FD"/>
      <stop offset="1" stop-color="#0064F9"/>
    </linearGradient>
    <linearGradient id="azFolderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0698D6"/>
      <stop offset="1" stop-color="#0052CC"/>
    </linearGradient>
  </defs>
  <path fill="url(#azFolderBack)" d="M14 40 a10 10 0 0 1 10 -10 h26 a10 10 0 0 1 8 4 l7 9 h35 a10 10 0 0 1 10 10 v51 a10 10 0 0 1 -10 10 H24 a10 10 0 0 1 -10 -10 Z"/>
  <path fill="url(#azFolder)" d="M14 56 a10 10 0 0 1 10 -10 h80 a10 10 0 0 1 10 10 v42 a10 10 0 0 1 -10 10 H24 a10 10 0 0 1 -10 -10 Z"/>
  <!-- White trash can: lid + handle on top, tapered bin body with vertical ribs cut to the
       gradient. -->
  <g fill="#ffffff">
    <rect x="48" y="64" width="32" height="6" rx="3"/>
    <rect x="58" y="59" width="12" height="5" rx="2.5"/>
    <path d="M50 72 h28 l-3 32 a4 4 0 0 1 -4 3.6 H57 a4 4 0 0 1 -4 -3.6 Z"/>
  </g>
  <g fill="#06B8FD">
    <rect x="58" y="78" width="4" height="22" rx="2"/>
    <rect x="66" y="78" width="4" height="22" rx="2"/>
  </g>
</svg>
