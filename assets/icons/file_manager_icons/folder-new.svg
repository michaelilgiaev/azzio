<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Azzio "Create New Folder" icon (theme name folder-new). The Azzio folder with a plus badge,
       in the cyan-to-blue gradient, matching folder.svg. Overrides Adwaita's folder-new for the
       "Create New Folder..." menu entry (thunar-action-manager.c). -->
  <defs>
    <linearGradient id="azGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07AFE8"/>
      <stop offset="0.5" stop-color="#06B8FD"/>
      <stop offset="1" stop-color="#0064F9"/>
    </linearGradient>
    <linearGradient id="azGradBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0698D6"/>
      <stop offset="1" stop-color="#0052CC"/>
    </linearGradient>
  </defs>
  <!-- Folder back panel + tab. -->
  <path fill="url(#azGradBack)"
        d="M14 40 a10 10 0 0 1 10 -10 h26 a10 10 0 0 1 8 4 l7 9 h35 a10 10 0 0 1 10 10 v51 a10 10 0 0 1 -10 10 H24 a10 10 0 0 1 -10 -10 Z"/>
  <!-- Folder front flap. -->
  <path fill="url(#azGrad)"
        d="M14 56 a10 10 0 0 1 10 -10 h80 a10 10 0 0 1 10 10 v42 a10 10 0 0 1 -10 10 H24 a10 10 0 0 1 -10 -10 Z"/>
  <!-- Plus badge cut into the flap (white). -->
  <path fill="#FFFFFF" d="M58 66 h12 v12 h12 v12 h-12 v12 h-12 v-12 h-12 v-12 h12 Z"/>
</svg>
