<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Azzio SSH folder (Azzio-only name folder-ssh, the ~/SSH shortcut, which links to .ssh,
       holding keys and known_hosts). No XDG theme name, so the vendored file manager maps this
       basename to it. Base Azzio folder plus a white key on the front flap (credentials). -->
  <defs>
    <linearGradient id="azFolder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07AFE8"/>
      <stop offset="0.5" stop-color="#06B8FD"/>
      <stop offset="1" stop-color="#0064F9"/>
    </linearGradient>
    <linearGradient id="azFolderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0698D6"/>
      <stop offset="1" stop-color="#0052CC"/>
    </linearGradient>
  </defs>
  <path fill="url(#azFolderBack)" d="M14 40 a10 10 0 0 1 10 -10 h26 a10 10 0 0 1 8 4 l7 9 h35 a10 10 0 0 1 10 10 v51 a10 10 0 0 1 -10 10 H24 a10 10 0 0 1 -10 -10 Z"/>
  <path fill="url(#azFolder)" d="M14 56 a10 10 0 0 1 10 -10 h80 a10 10 0 0 1 10 10 v42 a10 10 0 0 1 -10 10 H24 a10 10 0 0 1 -10 -10 Z"/>
  <!-- White key: a ring (bow) with the hole cut to the gradient, and a shaft with two bit teeth. -->
  <circle fill="#ffffff" cx="56" cy="72" r="14"/>
  <circle fill="#06B8FD" cx="56" cy="72" r="6"/>
  <rect fill="#ffffff" x="66" y="78" width="26" height="8" rx="4" transform="rotate(45 66 78)"/>
  <rect fill="#ffffff" x="82" y="92" width="10" height="7" rx="2" transform="rotate(45 82 92)"/>
</svg>
